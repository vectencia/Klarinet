# Web demo at / and Dokka HTML at /api/. Maintainer guide: GITHUB_PAGES.md
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web demo and API docs
        run: ./gradlew :demo-web:jsBrowserDistribution :dokkaGenerate

      - name: Assemble site
        run: bash ./scripts/assemble-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. An org admin must open Settings → Pages and set Source to GitHub Actions, then re-run this workflow. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages"
          fi

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
